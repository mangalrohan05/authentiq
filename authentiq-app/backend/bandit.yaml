exclude_dirs:
  - /tests
  - /__pycache__
  - /venv
  - /env
  - /.venv
  - /htmlcov
  - /.pytest_cache

skips:
  - 'B101'  # assert_used (we use assertions in tests)
  - 'B601'  # paramiko_calls (not using paramiko)

tests:
  - B201  # flask_debug_true (check for debug mode)
  - B301  # pickle (check for pickle usage)
  - B302  # marshal (check for marshal usage)
  - B303  # md5 (check for weak hash)
  - B304  # ciphers (check for weak ciphers)
  - B305  # cipher_modes (check for weak cipher modes)
  - B306  # mktemp_q (check for mktemp usage)
  - B307  # eval (check for eval usage)
  - B308  # mark_safe (check for mark_safe usage)
  - B309  # httpsconnection (check for HTTPS usage)
  - B310  # urllib_urlopen (check for urllib usage)
  - B311  # random (check for random usage)
  - B312  # telnetlib (check for telnetlib usage)
  - B313  # xml_bad_cElementTree (check for XML usage)
  - B314  # xml_bad_ElementTree (check for XML usage)
  - B315  # xml_bad_expatreader (check for XML usage)
  - B316  # xml_bad_expatbuilder (check for XML usage)
  - B317  - xml_bad_sax (check for XML usage)
  - B318  - xml_bad_minidom (check for XML usage)
  - B319  - xml_bad_pulldom (check for XML usage)
  - B320  - xml_bad_etree (check for XML usage)
  - B321  - ftplib (check for FTP usage)
  - B322  - input (check for input usage)
  - B323  - unverified_context (check for SSL context)
  - B324  - hashlib_new_insecure_functions (check for weak hash functions)
  - B325  - tempnam (check for tempnam usage)
  - B401  - import_telnetlib (check for telnetlib import)
  - B402  - import_ftplib (check for FTP import)
  - B403  - import_pickle (check for pickle import)
  - B404  - import_subprocess (check for subprocess import)
  - B405  - import_xml_etree (check for XML import)
  - B406  - import_xml_sax (check for XML import)
  - B407  - import_xml_expat (check for XML import)
  - B408  - import_xml_minidom (check for XML import)
  - B409  - import_xml_pulldom (check for XML import)
  - B410  - import_lxml (check for lxml import)
  - B411  - import_xmlrpclib (check for XML-RPC import)
  - B412  - import_httpoxy (check for httpoxy import)
