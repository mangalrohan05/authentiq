  - B501  - request_with_no_cert_validation (check for SSL validation)
  - B502  - ssl_with_bad_version (check for SSL version)
  - B503  - ssl_with_bad_defaults (check for SSL defaults)
  - B504  - ssl_with_no_version (check for SSL version)
  - B505  - weak_cryptographic_key (check for weak keys)
  - B506  - yaml_load (check for yaml.load)
  - B507  - ssh_no_host_key_verification (check for SSH host key verification)
  - B601  - paramiko_calls (check for paramiko usage)
  - B602  - subprocess_popen_with_shell_equals_true (check for shell=True)
  - B603  - subprocess_without_shell_equals_true (check for subprocess usage)
  - B604  - any_other_function_with_shell_equals_true (check for shell=True)
  - B605  - start_process_with_a_shell (check for shell usage)
